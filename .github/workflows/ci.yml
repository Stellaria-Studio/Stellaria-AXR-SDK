name: SDK validation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native (${{ matrix.os }}, formal=${{ matrix.formal }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        formal: ["OFF", "ON"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 sqlite
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows sqlite3:x64-windows nlohmann-json:x64-windows
      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAXR_PLATFORM_HELPERS=OFF -DAXR_SECURITY_RELEASE=${{ matrix.formal }} "${args[@]}"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DAXR_SECURITY_RELEASE=${{ matrix.formal }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install SDK
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/installed"
      - name: Consume installed SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"); fi
          cmake -S examples/cmake -B consumer -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/installed" "${args[@]}"
          cmake --build consumer --config Release --parallel 2
          consumer/axr-consumer
      - name: Consume installed SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S examples/cmake -B consumer -A x64 "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/installed" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer --config Release --parallel 2
          $env:PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          & consumer/Release/axr-consumer.exe
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .
      - run: python scripts/verify_legal_sources.py
      - run: python -m pytest tests/python
      - run: python examples/propose.py
